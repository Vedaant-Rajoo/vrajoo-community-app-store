version: "3.7"

services:
  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: vedaant-bookorbit_app_1
      APP_PORT: 3000
      # BookOrbit has its own login; Kobo, KOReader, OPDS and the iOS app need direct access.
      PROXY_AUTH_ADD: "false"

  app:
    image: ghcr.io/bookorbit/bookorbit:3.6.0@sha256:bbb5da52e96dbbff1dd36f55454f9845e6cde264b4b3428a3ea783124a4ca62e
    restart: on-failure
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: vedaant-bookorbit_postgres_1
      POSTGRES_PORT: 5432
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD: ${APP_VEDAANT_BOOKORBIT_DB_PASSWORD}
      POSTGRES_DB: bookorbit
      JWT_SECRET: ${APP_VEDAANT_BOOKORBIT_JWT_SECRET}
      PODCAST_ENCRYPTION_KEY: ${APP_VEDAANT_BOOKORBIT_PODCAST_ENCRYPTION_KEY}
      EMAIL_ENCRYPTION_KEY: ${APP_VEDAANT_BOOKORBIT_EMAIL_ENCRYPTION_KEY}
      MIGRATION_ENCRYPTION_KEY: ${APP_VEDAANT_BOOKORBIT_MIGRATION_ENCRYPTION_KEY}
      BOOK_REQUEST_ENCRYPTION_KEY: ${APP_VEDAANT_BOOKORBIT_BOOK_REQUEST_ENCRYPTION_KEY}
      # Shown in the umbrelOS UI as the app password; enter it in the first-run setup wizard.
      SETUP_BOOTSTRAP_TOKEN: ${APP_PASSWORD}
      APP_URL: http://${DEVICE_DOMAIN_NAME}:6061
      PUID: 1000
      PGID: 1000
      LIBRARY_BROWSE_ROOT: /books
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${UMBREL_ROOT}/data/storage/downloads/books:/books
      - ${APP_DATA_DIR}/data/app:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  postgres:
    image: pgvector/pgvector:0.8.7-pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    restart: on-failure
    environment:
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD: ${APP_VEDAANT_BOOKORBIT_DB_PASSWORD}
      POSTGRES_DB: bookorbit
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
